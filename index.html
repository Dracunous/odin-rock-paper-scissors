<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="main">

        <h1 id="heading">Rock-Paper-Scissors</h1>

        <div class="card" id="choice-card">

            <p>Round <span id="counter">1</span></p>

            <div class="score">

                <p>YourScore <span id="player-score">0</span></p>
                <p>ComputeScore <span id="cmp-score">0</span></p>

            </div>

            <div class="choices">
                <button id="rock" class="btn">Rock</button>
                <button id="paper" class="btn">Paper</button>
                <button id="scissors" class="btn">Scissors</button>
            </div>



        </div>

        <div class="card" id="computer-card">

            <p>Computer's Choice</p>

             <div class="score">

                <p>YourScore <span id="playe-score">0</span></p>
                <p>ComputeScore <span id="cm-score">0</span></p>

            </div>

           <p id="human"></p><span>vs</span> <p id="cmp"></p>









        </div>

        <div class="card" id="winner-card">
        

            <p id="win">Winner</p>

            <p id="winner"></p>





        </div>

        <div class="card" id="result-card">

            <p>Result</p>
            <p id="message"></p>





        </div>


    </div>
</body>

</html>
